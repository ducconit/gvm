name: "✨ Feature Request"
description: "Suggest a new feature, command, IDE skill target, or MCP tool / Đề xuất tính năng mới"
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make **gvm (`g`)** even better? Share it below!

  - type: textarea
    id: problem
    attributes:
      label: "Problem or Use Case / Vấn đề hoặc Nhu cầu sử dụng"
      description: "What problem does this feature solve?"
      placeholder: "I would like to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution / Giải pháp đề xuất"
      description: "Describe how the command, flag, or MCP tool should work."
      placeholder: "Example: `g skills install --ide ...`"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Additional Context / Thông tin bổ sung"
      description: "Any other context, links, or examples."
    validations:
      required: false
