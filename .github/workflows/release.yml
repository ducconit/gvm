name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build Cross-Platform Binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}" make cross-build
          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/g-linux-amd64
            dist/g-linux-arm64
            dist/g-darwin-amd64
            dist/g-darwin-arm64
            dist/g-windows-amd64.exe
            dist/g-windows-arm64.exe
            dist/checksums.txt
