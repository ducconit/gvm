name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    name: Test & Cross-Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Run go vet
        run: go vet ./...

      - name: Run unit & integration tests with race detector
        run: go test -v -race -count=1 ./...

      - name: Cross-compile binaries (macOS, Linux, Windows)
        run: make cross-build
